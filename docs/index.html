<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buse — Kalbimin Koordinatları</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#11070b;color:#f7eee7;font-family:Arial,sans-serif;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 75% 25%,#3a101d,transparent 34%),radial-gradient(circle at 20% 90%,#260c16,transparent 36%);pointer-events:none}section{min-height:100svh;position:relative;z-index:1}.intro{display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,8vw,120px);animation:in 1.2s ease}.eyebrow{color:#e9778d;letter-spacing:.32em;font-size:10px;margin:0 0 25px}h1{font:400 clamp(55px,10vw,132px)/.85 Georgia,serif;letter-spacing:-.05em;margin:0}.copy{color:#ab9190;line-height:1.75;margin:38px 0 28px;font-size:14px}.open{width:145px;color:#f7eee7;padding:14px 0;border:0;border-bottom:1px solid #ffffff40;background:none;display:flex;justify-content:space-between;cursor:pointer;transition:.3s}.open:hover{width:175px;color:#ff9eb1;border-color:#ff9eb1}.sign{position:absolute;right:5vw;bottom:5vh;font:italic 13px Georgia;color:#795f64}.story{display:none;place-items:center}.story.show{display:grid;animation:in 1s ease}header{position:absolute;top:28px;left:5vw;right:5vw;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;color:#8e7379}header button{color:inherit;border:0;background:none;cursor:pointer}canvas{width:min(780px,96vw);height:min(720px,82svh)}.coords{position:absolute;left:5vw;top:20%;color:#60454c;font-size:10px;line-height:2}.message{position:absolute;text-align:center;opacity:0;transform:translateY(12px);transition:1.2s}.message.visible{opacity:1;transform:none}.message p{margin:0;color:#ae9297;font:italic 15px Georgia}.message h2{margin:6px 0 24px;font:400 clamp(30px,5vw,58px) Georgia}.message button{border:0;background:none;color:#ad818a;cursor:pointer}.count{position:absolute;right:5vw;top:43%;color:#886069;font:30px Georgia;text-align:right}.count small{display:block;width:110px;color:#5f474c;font:9px Arial}footer{position:absolute;bottom:24px;left:5vw;right:5vw;display:flex;justify-content:space-between;color:#73555b;font-size:10px;letter-spacing:.25em}footer i{font:italic 13px Georgia;letter-spacing:0;color:#96757c}@keyframes in{from{opacity:0;transform:translateY(14px)}}@media(max-width:600px){.intro{justify-content:flex-end;padding:0 25px 14vh}h1{font-size:58px}.sign{right:25px}.coords,.count{display:none}canvas{height:70svh;transform:scale(1.18)}.message{top:41%}.message h2{font-size:34px}}
</style></head><body>
<section class="intro" id="intro"><p class="eyebrow">SADECE BİR KİŞİ İÇİN</p><h1>Buse’ye küçük<br>bir sürpriz.</h1><p class="copy">Bazı hisler cümlelere sığmıyor.<br>Ben de onları nokta nokta çizdim.</p><button class="open" id="open"><span>başlat</span><span>→</span></button><p class="sign">senin için, her seferinde yeniden.</p></section>
<section class="story" id="story"><header><span>B × ∞</span><button id="sound">sessiz</button></header><div class="coords">41°01′<br>29°00′</div><canvas id="canvas"></canvas><div class="message" id="message"><p>Kalbimin bütün koordinatları</p><h2>sana çıkıyor.</h2><button id="again">bir daha çiz ↻</button></div><div class="count"><span id="count">…</span><small>küçük nokta, tek bir isim.</small></div><footer><span>BUSE</span><i>İyi ki varsın.</i><span>♥</span></footer></section>
<script>
const heart=Array.from({length:86},(_,i)=>{const t=Math.PI*2*i/86;return{x:50+2.65*16*Math.sin(t)**3,y:43-2.15*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)),k:0}}),L={B:[[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[2,0],[3,1],[2,2],[1,2],[3,3],[2,4],[1,4]],U:[[0,0],[0,1],[0,2],[0,3],[1,4],[2,4],[3,3],[3,2],[3,1],[3,0]],S:[[3,0],[2,0],[1,0],[0,1],[1,2],[2,2],[3,3],[2,4],[1,4],[0,4]],E:[[3,0],[2,0],[1,0],[0,0],[0,1],[0,2],[1,2],[2,2],[0,3],[0,4],[1,4],[2,4],[3,4]]},name=[..."BUSE"].flatMap((l,n)=>L[l].map(([x,y])=>({x:30+n*11+x*2.4,y:77+y*2.5,k:1}))),pts=[...heart,...name];let audio=false,timer;
function draw(){clearInterval(timer);const c=document.querySelector('#canvas'),x=c.getContext('2d'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.scale(d,d);x.clearRect(0,0,r.width,r.height);message.classList.remove('visible');count.textContent='…';let i=0;timer=setInterval(()=>{if(i>=pts.length){clearInterval(timer);message.classList.add('visible');count.textContent=pts.length;return}const p=pts[i],q=pts[i-1],X=p.x*r.width/100,Y=p.y*r.height/100;if(q&&q.k===p.k){x.beginPath();x.moveTo(q.x*r.width/100,q.y*r.height/100);x.lineTo(X,Y);x.strokeStyle=p.k?'#ffe2bdb8':'#ff7e95b8';x.stroke()}x.beginPath();x.arc(X,Y,p.k?1.8:2.1,0,7);x.fillStyle=p.k?'#ffe2bd':'#ff8da3';x.shadowColor=x.fillStyle;x.shadowBlur=12;x.fill();x.shadowBlur=0;if(audio&&i%12===0){const a=new AudioContext,o=a.createOscillator(),g=a.createGain();o.frequency.value=440+Math.random()*220;g.gain.setValueAtTime(.02,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.3)}i++},34)}
const openButton=document.getElementById('open'),introScreen=document.getElementById('intro'),storyScreen=document.getElementById('story'),message=document.getElementById('message'),count=document.getElementById('count'),againButton=document.getElementById('again'),soundButton=document.getElementById('sound');
openButton.addEventListener('click',()=>{introScreen.style.display='none';storyScreen.classList.add('show');draw()});againButton.addEventListener('click',draw);soundButton.addEventListener('click',()=>{audio=!audio;soundButton.textContent=audio?'ses açık':'sessiz'});
</script></body></html>
